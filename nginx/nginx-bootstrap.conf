# Config TEMPORÁRIA — usada só na primeira subida, antes de existir certificado SSL.
# Depois de emitir o certificado (passo 5 do README), troque para o nginx.conf definitivo.
server {
    listen 80;
    server_name sandraellenmodas.com www.sandraellenmodas.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
